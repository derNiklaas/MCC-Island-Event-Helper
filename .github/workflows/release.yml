name: release
on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: build
        run: gradle build

      - name: read metadata
        id: metadata
        run: |
          echo "version=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %s')
          else
            LOG=$(git log --pretty=format:'- %s')
          fi
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: publish to modrinth & github
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          # ---- artifacts ----
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
            build/libs/*-@(dev|sources|javadoc).jar

          # ---- release info ----
          name: MCC Island Event Helper ${{ steps.metadata.outputs.version }}
          version: ${{ steps.metadata.outputs.version }}
          version-type: release
          changelog: ${{ steps.changelog.outputs.log }}

          # ---- metadata ----
          loaders: fabric
          game-versions: |
            26.1.2
            26.2
            26.3
          java: 25
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            fabric-language-kotlin(required){modrinth:Ha28R6CL}
            yet_another_config_lib_v3(required){modrinth:1eAoo2KR}
            modmenu(optional){modrinth:mOgUt4GM}

          # ---- modrinth ----
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # ---- github release ----
          github-tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}