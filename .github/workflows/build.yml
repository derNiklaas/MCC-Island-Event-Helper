name: build
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # GitHub cache entries gets deleted after 7 days of inactivity. This keeps the gradle cache in use
  schedule:
    - cron: '4 4 * * 1,4'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: build every target
        run: |
          for target in 26.1.2 26.2 26.3; do
            gradle build -Ptarget="$target"
          done
